[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "traceguard-api"
version = "0.1.0"
description = "TraceGuard FastAPI Backend — Web Privacy & Security Intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "sqlalchemy==2.0.41",
    "alembic==1.15.2",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "email-validator==2.2.0",
    "pwdlib[argon2]==0.2.1",
    "PyJWT==2.10.1",
    "httpx==0.28.1",
    "aiosqlite==0.21.0",
    "asyncpg==0.32.0",
    "greenlet==3.2.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "httpx==0.28.1",
    "anyio==4.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/api"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
