name: TraceGuard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Typecheck and Static Analysis
  # ----------------------------------------------------------------------------
  typecheck:
    name: Monorepo Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.4.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck across monorepo
        run: pnpm run typecheck

  # ----------------------------------------------------------------------------
  # 2. Test Suites (Vitest + Pytest)
  # ----------------------------------------------------------------------------
  test:
    name: Unit & Integration Tests (Vitest + Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.4.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Vitest suite (144 tests)
        run: pnpm test

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run FastAPI backend Pytest suite (18 tests)
        run: pytest tests/api -v

  # ----------------------------------------------------------------------------
  # 3. Production Artifact Builds
  # ----------------------------------------------------------------------------
  build:
    name: Build Extension & Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.4.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome Extension (MV3)
        run: pnpm --filter @traceguard/extension build

      - name: Verify Extension build artifact
        run: test -d apps/extension/dist && test -f apps/extension/dist/manifest.json

      - name: Build Next.js Dashboard
        run: pnpm --filter @traceguard/dashboard build

      - name: Verify Dashboard build artifact
        run: test -d apps/dashboard/.next

  # ----------------------------------------------------------------------------
  # 4. Container Build Verification
  # ----------------------------------------------------------------------------
  docker:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: traceguard-api:test

      - name: Build Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          push: false
          tags: traceguard-dashboard:test
