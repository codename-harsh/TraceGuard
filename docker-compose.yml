services:
  postgres:
    image: postgres:16-alpine
    container_name: traceguard_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceguard} -d ${POSTGRES_DB:-traceguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: traceguard_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-traceguard}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-traceguard}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,chrome-extension://*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: node:20-alpine
    container_name: traceguard_dashboard
    working_dir: /app
    volumes:
      - ./apps/dashboard:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    profiles:
      - dashboard

volumes:
  postgres_data:
    name: traceguard_postgres_data
