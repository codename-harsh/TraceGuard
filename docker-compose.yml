# ==============================================================================
# TraceGuard — Production & Development Docker Compose Stack
# Components: PostgreSQL 16, FastAPI Backend, Next.js Web Dashboard
# Note: Chrome Extension runs 100% locally in user browsers (not containerized).
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: traceguard_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceguard} -d ${POSTGRES_DB:-traceguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend Service (/api/v1)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: traceguard_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-traceguard}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-traceguard}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-must-be-32-chars-long}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,chrome-extension://*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Next.js Web Dashboard Service
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: traceguard_dashboard
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
    name: traceguard_postgres_data
